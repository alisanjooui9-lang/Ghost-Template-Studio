<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore | Ghost Template Studio</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #050806;
            --card: #0b100e;
            --card2: #101713;
            --green: #00ff99;
            --text: #ffffff;
            --muted: #89958f;
            --border: rgba(0,255,153,.13);
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(0,255,153,.12),
                    transparent 35%
                ),
                var(--bg);
            color: var(--text);
            font-family: Tahoma, Arial, sans-serif;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(5,8,6,.94);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 13px 15px;
        }

        .header-inner {
            max-width: 1000px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back {
            width: 43px;
            height: 43px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card);
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .header-info {
            flex: 1;
        }

        .header-info h1 {
            font-size: 17px;
        }

        .header-info p {
            color: var(--muted);
            font-size: 10px;
            margin-top: 3px;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 23px 15px 40px;
        }

        .hero {
            margin-bottom: 22px;
        }

        .hero small {
            color: var(--green);
            font-size: 11px;
            letter-spacing: 1px;
        }

        .hero h2 {
            margin-top: 8px;
            font-size: clamp(27px, 8vw, 42px);
        }

        .hero p {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.9;
            margin-top: 8px;
        }

        .search {
            position: relative;
            margin-bottom: 16px;
        }

        .search input {
            width: 100%;
            height: 51px;
            border-radius: 15px;
            border: 1px solid var(--border);
            background: var(--card);
            color: white;
            outline: none;
            padding: 0 46px 0 15px;
            font-family: inherit;
            font-size: 14px;
        }

        .search input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(0,255,153,.07);
        }

        .search-icon {
            position: absolute;
            right: 16px;
            top: 15px;
            font-size: 19px;
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 7px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category {
            flex: 0 0 auto;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--muted);
            padding: 10px 15px;
            border-radius: 11px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }

        .category.active {
            background: var(--green);
            color: #00150d;
            border-color: var(--green);
            font-weight: bold;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .topbar h3 {
            font-size: 17px;
        }

        .count {
            color: var(--muted);
            font-size: 10px;
        }

        .templates {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .template-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            transition:
                transform .2s ease,
                border-color .2s ease;
        }

        .template-card:active {
            transform: scale(.98);
        }

        .template-card:hover {
            border-color: rgba(0,255,153,.35);
        }

        .preview {
            height: 135px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(
                    135deg,
                    #15251f,
                    #07100c
                );
        }

        .preview::before {
            content: "";
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(0,255,153,.07);
            top: -60px;
            left: -40px;
        }

        .preview::after {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(0,255,153,.05);
            bottom: -50px;
            right: -30px;
        }

        .preview-icon {
            position: relative;
            z-index: 2;
            font-size: 47px;
        }

        .preview-label {
            position: absolute;
            top: 9px;
            right: 9px;
            z-index: 3;
            padding: 5px 8px;
            border-radius: 7px;
            background: rgba(0,0,0,.45);
            color: var(--green);
            border: 1px solid rgba(0,255,153,.2);
            font-size: 8px;
        }

        .template-info {
            padding: 13px;
        }

        .template-category {
            color: var(--green);
            font-size: 9px;
            margin-bottom: 6px;
        }

        .template-name {
            font-size: 14px;
            margin-bottom: 7px;
        }

        .template-description {
            color: var(--muted);
            font-size: 10px;
            line-height: 1.7;
            min-height: 34px;
        }

        .creator {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 11px;
            color: var(--muted);
            font-size: 9px;
        }

        .creator-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #15251f;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stats {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            padding-top: 9px;
            border-top: 1px solid rgba(255,255,255,.05);
        }

        .stats span {
            color: #66736d;
            font-size: 8px;
        }

        .stats b {
            color: #9aa59f;
            font-weight: normal;
        }

        .empty {
            display: none;
            text-align: center;
            padding: 55px 20px;
            border: 1px dashed var(--border);
            border-radius: 20px;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .empty h3 {
            font-size: 17px;
        }

        .empty p {
            color: var(--muted);
            font-size: 11px;
            margin-top: 8px;
        }

        @media (min-width: 650px) {

            .templates {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            }

            .preview {
                height: 170px;
            }

        }

        @media (min-width: 900px) {

            .templates {
                grid-template-columns: repeat(4, 1fr);
            }

            .preview {
                height: 175px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-inner">

        <button
            class="back"
            id="backButton"
            type="button"
        >
            ←
        </button>

        <div class="header-info">

            <h1>
                👻 Explore
            </h1>

            <p>
                کشف قالب‌های Ghost Template Studio
            </p>

        </div>

    </div>

</header>


<main>


    <section class="hero">

        <small>
            GHOST TEMPLATE LIBRARY
        </small>

        <h2>
            قالب‌ها را کشف کن
        </h2>

        <p>
            از بین قالب‌های آماده انتخاب کن،
            پیش‌نمایش را ببین و برای ساخت سایت
            خودت استفاده کن.
        </p>

    </section>


    <div class="search">

        <span class="search-icon">
            🔎
        </span>

        <input
            id="searchInput"
            type="search"
            placeholder="جستجوی قالب..."
            autocomplete="off"
        >

    </div>


    <div class="categories">

        <button
            class="category active"
            data-category="all"
            type="button"
        >
            همه
        </button>

        <button
            class="category"
            data-category="portfolio"
            type="button"
        >
            💼 نمونه‌کار
        </button>

        <button
            class="category"
            data-category="gaming"
            type="button"
        >
            🎮 گیمینگ
        </button>

        <button
            class="category"
            data-category="store"
            type="button"
        >
            🛒 فروشگاهی
        </button>

        <button
            class="category"
            data-category="business"
            type="button"
        >
            🏢 شرکتی
        </button>

        <button
            class="category"
            data-category="landing"
            type="button"
        >
            🚀 لندینگ
        </button>

        <button
            class="category"
            data-category="blog"
            type="button"
        >
            📰 وبلاگ
        </button>

        <button
            class="category"
            data-category="education"
            type="button"
        >
            🎓 آموزشی
        </button>

    </div>


    <div class="topbar">

        <h3>
            قالب‌های آماده
        </h3>

        <span
            class="count"
            id="templateCount"
        >
            0 قالب
        </span>

    </div>


    <section
        class="templates"
        id="templatesContainer"
    ></section>


    <section
        class="empty"
        id="emptyState"
    >

        <div class="empty-icon">
            🔍
        </div>

        <h3>
            قالبی پیدا نشد
        </h3>

        <p>
            نام قالب یا دسته‌بندی دیگری را امتحان کن.
        </p>

    </section>


</main>


<script src="templates.js"></script>


<script>

    const container =
        document.getElementById(
            "templatesContainer"
        );

    const emptyState =
        document.getElementById(
            "emptyState"
        );

    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const templateCount =
        document.getElementById(
            "templateCount"
        );


    let currentCategory = "all";


    function escapeHTML(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    function renderTemplates() {

        const search =
            searchInput.value
                .trim()
                .toLowerCase();


        const filtered =
            GHOST_TEMPLATES.filter(template => {

                const categoryMatch =
                    currentCategory === "all" ||
                    template.category === currentCategory;


                const searchMatch =
                    !search ||
                    template.name
                        .toLowerCase()
                        .includes(search) ||

                    template.description
                        .toLowerCase()
                        .includes(search) ||

                    template.categoryName
                        .toLowerCase()
                        .includes(search);


                return categoryMatch && searchMatch;

            });


        container.innerHTML = "";


        templateCount.textContent =
            `${filtered.length} قالب`;


        if (filtered.length === 0) {

            container.style.display = "none";
            emptyState.style.display = "block";

            return;

        }


        container.style.display = "grid";
        emptyState.style.display = "none";


        filtered.forEach(template => {

            const card =
                document.createElement("article");


            card.className =
                "template-card";


            card.dataset.id =
                template.id;


            card.innerHTML = `

                <div class="preview">

                    <span class="preview-label">
                        PREVIEW
                    </span>

                    <span class="preview-icon">
                        ${escapeHTML(template.icon)}
                    </span>

                </div>


                <div class="template-info">

                    <div class="template-category">
                        ${escapeHTML(template.categoryName)}
                    </div>

                    <div class="template-name">
                        ${escapeHTML(template.name)}
                    </div>

                    <div class="template-description">
                        ${escapeHTML(template.description)}
                    </div>


                    <div class="creator">

                        <div class="creator-icon">
                            👻
                        </div>

                        <span>
                            ${escapeHTML(template.creator)}
                        </span>

                    </div>


                    <div class="stats">

                        <span>
                            ♡ <b>${template.likes}</b>
                        </span>

                        <span>
                            👁 <b>${template.views}</b>
                        </span>

                        <span>
                            🚀 <b>${template.uses}</b>
                        </span>

                    </div>

                </div>

            `;


            card.addEventListener(
                "click",
                () => {

                    localStorage.setItem(
                        "ghost_selected_template",
                        JSON.stringify(template)
                    );

                    window.location.href =
                        "template.html?id=" +
                        encodeURIComponent(
                            template.id
                        );

                }
            );


            container.appendChild(card);

        });

    }


    document
        .querySelectorAll(".category")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(".category")
                        .forEach(item => {

                            item.classList.remove(
                                "active"
                            );

                        });


                    button.classList.add("active");


                    currentCategory =
                        button.dataset.category;


                    renderTemplates();

                }
            );

        });


    searchInput.addEventListener(
        "input",
        renderTemplates
    );


    document
        .getElementById("backButton")
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "studio.html";

            }
        );


    if (
        typeof GHOST_TEMPLATES ===
        "undefined"
    ) {

        container.innerHTML = "";

        emptyState.style.display = "block";

        emptyState.querySelector("h3")
            .textContent =
            "خطا در بارگذاری قالب‌ها";

        emptyState.querySelector("p")
            .textContent =
            "مطمئن شو فایل templates.js کنار explore.html قرار دارد.";

    } else {

        renderTemplates();

    }

</script>


</body>
</html>
