<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Template Studio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050505;
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            overflow: hidden;
        }

        #splash {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at center, #14251f 0%, #070b09 45%, #020202 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 9999;
            transition: opacity 1.2s ease, visibility 1.2s ease;
        }

        .splash-content {
            width: 90%;
        }

        .studio {
            font-size: clamp(22px, 7vw, 42px);
            font-weight: 800;
            letter-spacing: 4px;
            color: #00ff99;
            opacity: 0;
            transform: translateY(25px);
            animation: showStudio 1.4s ease forwards;
        }

        .presents {
            margin-top: 18px;
            font-size: clamp(15px, 4vw, 20px);
            color: #bdbdbd;
            opacity: 0;
            animation: showPresents 1.2s ease 1.1s forwards;
        }

        .app-name {
            margin-top: 20px;
            font-size: clamp(30px, 9vw, 55px);
            font-weight: 900;
            color: #ffffff;
            opacity: 0;
            transform: scale(.92);
            animation: showApp 1.5s ease 1.9s forwards;
        }

        .line {
            width: 0;
            height: 2px;
            background: #00ff99;
            margin: 22px auto 0;
            box-shadow: 0 0 15px #00ff99;
            animation: showLine 1s ease 2.5s forwards;
        }

        .loading {
            margin-top: 35px;
            font-size: 12px;
            color: #777;
            opacity: 0;
            animation: showLoading 1s ease 2.8s forwards;
        }

        @keyframes showStudio {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes showPresents {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes showApp {
            from {
                opacity: 0;
                transform: scale(.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes showLine {
            from {
                width: 0;
            }
            to {
                width: min(220px, 55vw);
            }
        }

        @keyframes showLoading {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        #splash.hide {
            opacity: 0;
            visibility: hidden;
        }

        @media (prefers-reduced-motion: reduce) {
            .studio,
            .presents,
            .app-name,
            .line,
            .loading {
                animation: none;
                opacity: 1;
                transform: none;
            }

            .line {
                width: 220px;
            }
        }
    </style>
</head>

<body>

    <div id="splash">
        <div class="splash-content">

            <div class="studio">
                GHOST STUDIO
            </div>

            <div class="presents">
                تقدیم می‌کند
            </div>

            <div class="app-name">
                GHOST TEMPLATE<br>
                STUDIO
            </div>

            <div class="line"></div>

            <div class="loading">
                در حال آماده‌سازی...
            </div>

        </div>
    </div>

    <script>
        const splash = document.getElementById("splash");

        setTimeout(() => {
            splash.classList.add("hide");

            setTimeout(() => {
                window.location.href = "auth.html";
            }, 1200);

        }, 5000);
    </script>

</body>
</html>
